<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <title>WealthPulse • Neo-Cyber Financial Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.2);
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(168, 85, 247, 0.4);
        }
    </style>
</head>

<body
    class="bg-stone-50 dark:bg-[#0c0814] text-stone-900 dark:text-stone-100 min-h-screen w-full flex flex-col antialiased transition-colors duration-300 selection:bg-rose-500 selection:text-white">

    <div id="app" class="flex-1 w-full flex flex-col">
        <!-- Dynamic Content Injected Here -->
    </div>

    <!-- Receipt Preview Modal -->
    <div id="modal"
        class="hidden fixed inset-0 bg-stone-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div
            class="bg-white dark:bg-[#150f20] p-6 rounded-3xl max-w-lg w-full relative shadow-2xl border border-stone-200 dark:border-purple-950/60">
            <button onclick="closeModal()"
                class="absolute top-4 right-4 text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 font-extrabold text-lg transition">✕</button>
            <h3 class="font-extrabold text-stone-900 dark:text-white mb-3 text-sm flex items-center gap-2">
                <span>📄</span> Verified DB-Stored Document
            </h3>
            <img id="modalImg" src=""
                class="w-full h-auto rounded-2xl border border-stone-200 dark:border-purple-950 max-h-[420px] object-contain bg-stone-50 dark:bg-stone-950">
        </div>
    </div>

    <!-- Custom Budget Edit Modal -->
    <div id="budgetModal"
        class="hidden fixed inset-0 bg-stone-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div
            class="bg-white dark:bg-[#150f20] p-6 rounded-3xl max-w-sm w-full relative shadow-2xl border border-stone-200 dark:border-purple-950/60 space-y-4">
            <div class="flex items-center space-x-2 text-rose-600 dark:text-rose-400 font-bold text-sm">
                <span>🎯</span>
                <h3>Recalibrate Monthly Target</h3>
            </div>
            <p class="text-xs text-stone-500 dark:text-stone-400 leading-relaxed">Enter a new expenditure limit in
                Indian Rupees (₹) for the active calendar month.</p>
            <div>
                <label class="text-[11px] font-bold uppercase tracking-wider text-stone-400">New Target Limit
                    (₹)</label>
                <input id="newBudgetInput" type="number" step="1.00"
                    onkeydown="if(event.key==='Enter') submitNewBudget()"
                    class="w-full mt-1.5 p-3 border border-stone-200 dark:border-purple-950/80 rounded-xl text-sm bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-white outline-none focus:ring-2 focus:ring-rose-500 transition"
                    placeholder="e.g. 20000">
            </div>
            <div class="flex space-x-2.5 pt-2">
                <button type="button" onclick="submitNewBudget()"
                    class="flex-1 bg-rose-600 hover:bg-rose-500 text-white py-2.5 rounded-xl font-extrabold text-xs shadow-lg shadow-rose-600/30 transition">Save
                    Target</button>
                <button type="button" onclick="closeBudgetModal()"
                    class="flex-1 bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300 py-2.5 rounded-xl font-extrabold text-xs hover:bg-stone-200 dark:hover:bg-stone-700 transition">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Edit Transaction Modal -->
    <div id="editModal"
        class="hidden fixed inset-0 bg-stone-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div
            class="bg-white dark:bg-[#150f20] p-6 rounded-3xl max-w-md w-full relative shadow-2xl border border-stone-200 dark:border-purple-950/60 space-y-3.5 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-stone-100 dark:border-purple-950/40 pb-3">
                <h3 class="font-extrabold text-stone-900 dark:text-white text-sm flex items-center gap-2">
                    <span>✏️</span> Edit Transaction Document
                </h3>
                <button onclick="closeEditModal()"
                    class="text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 font-extrabold text-lg transition">✕</button>
            </div>
            <input type="hidden" id="editId">
            <div class="space-y-3">
                <div>
                    <label class="text-[11px] font-bold uppercase tracking-wider text-stone-400">Title /
                        Description</label>
                    <input id="editTitle" type="text"
                        class="w-full mt-1 p-2.5 border border-stone-200 dark:border-purple-950/80 rounded-xl text-xs bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-white outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="text-[11px] font-bold uppercase tracking-wider text-stone-400">Amount (₹)</label>
                        <input id="editAmount" type="number" step="0.01"
                            class="w-full mt-1 p-2.5 border border-stone-200 dark:border-purple-950/80 rounded-xl text-xs bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-white outline-none focus:ring-2 focus:ring-rose-500">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold uppercase tracking-wider text-stone-400">Category</label>
                        <select id="editCategory"
                            class="w-full mt-1 p-2.5 border border-stone-200 dark:border-purple-950/80 rounded-xl text-xs bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-white outline-none focus:ring-2 focus:ring-rose-500">
                            <option>Food & Dining</option>
                            <option>Subscriptions</option>
                            <option>Travel</option>
                            <option>Utilities</option>
                            <option>Shopping</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-[11px] font-bold uppercase tracking-wider text-stone-400">Date</label>
                    <input id="editDate" type="date"
                        class="w-full mt-1 p-2.5 border border-stone-200 dark:border-purple-950/80 rounded-xl text-xs bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-white outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                    <label class="text-[11px] font-bold uppercase tracking-wider text-stone-400">Update DB Receipt /
                        Take Photo</label>
                    <div class="flex gap-2 mt-1">
                        <input id="editReceiptFile" type="file" accept="image/*"
                            class="w-full p-1.5 border border-stone-200 dark:border-purple-950/80 rounded-xl text-[10px] bg-stone-50 dark:bg-stone-950 text-stone-400 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[10px] file:font-extrabold file:bg-rose-50 file:text-rose-700 dark:file:bg-rose-500/10 dark:file:text-rose-400">
                        <button type="button" onclick="openCamera('edit')"
                            class="bg-purple-950 text-white px-3 py-1.5 rounded-xl text-xs font-extrabold hover:bg-purple-900 transition whitespace-nowrap shadow-md">📷
                            Cam</button>
                    </div>
                    <p id="editSnapshotStatus"
                        class="text-[10px] text-rose-500 dark:text-rose-400 font-bold mt-1.5 hidden flex items-center gap-1">
                        <span>✅</span> New snapshot ready for DB update!
                    </p>
                </div>
            </div>

            <div class="flex space-x-2.5 pt-2">
                <button type="button" onclick="submitEditTransaction()"
                    class="flex-1 bg-rose-600 hover:bg-rose-500 text-white py-2.5 rounded-xl font-extrabold text-xs shadow-lg shadow-rose-600/30 transition">Update
                    Document</button>
                <button type="button" onclick="closeEditModal()"
                    class="flex-1 bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300 py-2.5 rounded-xl font-extrabold text-xs hover:bg-stone-200 dark:hover:bg-stone-700 transition">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Live Webcam Modal -->
    <div id="cameraModal"
        class="hidden fixed inset-0 bg-stone-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div
            class="bg-white dark:bg-[#150f20] p-6 rounded-3xl max-w-md w-full relative text-center shadow-2xl border border-stone-200 dark:border-purple-950/60">
            <h3
                class="font-extrabold text-stone-900 dark:text-white mb-3 text-base flex items-center justify-center gap-2">
                <span>📸</span> Live Document Camera
            </h3>
            <div
                class="relative bg-stone-950 rounded-2xl overflow-hidden aspect-video flex items-center justify-center mb-4 border border-purple-950">
                <video id="webcamVideo" autoplay playsinline class="w-full h-full object-cover"></video>
            </div>
            <div class="flex justify-center space-x-3">
                <button type="button" onclick="capturePhoto()"
                    class="bg-rose-600 hover:bg-rose-500 text-white px-5 py-2.5 rounded-xl font-extrabold text-xs shadow-lg shadow-rose-600/30 transition">Capture
                    Snapshot</button>
                <button type="button" onclick="closeCamera()"
                    class="bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300 px-5 py-2.5 rounded-xl font-extrabold text-xs hover:bg-stone-200 dark:hover:bg-stone-700 transition">Cancel</button>
            </div>
        </div>
    </div>
    <canvas id="snapshotCanvas" class="hidden"></canvas>

    <script>
        const API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '')
            ? 'http://localhost:3000'
            : '';// Replace with your actual deployed backend URL
        let currentUser = localStorage.getItem('userEmail') || null;
        let currentUserObj = JSON.parse(localStorage.getItem('currentUserObj')) || null;
        let currentView = 'login';
        let allExpenses = [];
        let capturedImageBlob = null;
        let editCapturedImageBlob = null;
        let activeCameraContext = 'add';
        let mediaStream = null;
        let isRadarActive = false;
        let cachedCoords = { longitude: 77.5946, latitude: 12.9716 };

        let currentTheme = localStorage.getItem('theme') || 'dark';
        if (currentTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // Dynamic Geolocation Polling (Every 2 Minutes / 120,000ms)
        function fetchUserLocationDynamic() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        cachedCoords.longitude = pos.coords.longitude;
                        cachedCoords.latitude = pos.coords.latitude;
                        console.log(`[Geo-Dynamic] Coordinates updated: Lat ${cachedCoords.latitude}, Lng ${cachedCoords.longitude}`);
                    },
                    (err) => {
                        console.warn("Geolocation permission denied or timeout, keeping current/default coordinates.");
                    },
                    { timeout: 10000, maximumAge: 30000, enableHighAccuracy: true }
                );
            }
        }
        // Initial fetch on load
        fetchUserLocationDynamic();
        // Setup recurring poll every 2 minutes (120,000 ms)
        setInterval(fetchUserLocationDynamic, 120000);

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', currentTheme);
            if (currentTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            render();
        }

        function render() {
            const app = document.getElementById('app');

            if (!currentUser) {
                app.className = "flex-1 w-full flex items-center justify-center p-4 bg-stone-100 dark:bg-[#0c0814]";
                if (currentView === 'login') {
                    app.innerHTML = `
                        <div class="w-full max-w-md bg-white dark:bg-[#150f20]/90 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-stone-200 dark:border-purple-950/60 relative">
                            <div class="absolute top-6 right-6 flex items-center space-x-2">
                                <button onclick="toggleTheme()" class="p-2 rounded-xl bg-stone-100 dark:bg-stone-800/80 text-stone-600 dark:text-stone-300 hover:bg-stone-200 dark:hover:bg-stone-700 transition text-xs font-bold flex items-center gap-1.5">
                                    ${currentTheme === 'dark' ? '☀️ Light' : '🌙 Dark'}
                                </button>
                            </div>

                            <div class="text-center mb-6 pt-2">
                                <div class="inline-flex p-3.5 bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 rounded-2xl text-2xl mb-3 shadow-inner">🔮</div>
                                <h2 class="text-2xl font-extrabold text-stone-900 dark:text-white tracking-tight">Welcome Back</h2>
                                <p class="text-xs text-stone-400 mt-1">Neo-Cyber Document Engine</p>
                            </div>
                            <div id="errorMsg" class="hidden bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-900/50 p-3 rounded-xl mb-4 text-xs text-center font-semibold"></div>
                            
                            <div class="space-y-3.5">
                                <div>
                                    <label class="text-[11px] font-bold uppercase tracking-wider text-stone-400">Email Address</label>
                                    <input id="loginEmail" type="email" placeholder="name@example.com" onkeydown="handleLoginInputKey(event, 'email')" class="w-full mt-1 p-3 border border-stone-200 dark:border-purple-950 rounded-xl text-sm bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-white outline-none focus:ring-2 focus:ring-rose-500 transition">
                                </div>
                                <div>
                                    <label class="text-[11px] font-bold uppercase tracking-wider text-stone-400">Secure Password</label>
                                    <input id="loginPassword" type="password" placeholder="••••••••" onkeydown="handleLoginInputKey(event, 'password')" class="w-full mt-1 p-3 border border-stone-200 dark:border-purple-950 rounded-xl text-sm bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-white outline-none focus:ring-2 focus:ring-rose-500 transition">
                                </div>
                                <button onclick="handleLogin()" class="w-full bg-rose-600 hover:bg-rose-500 text-white p-3.5 rounded-xl font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-rose-600/30 transition mt-2">Sign In to Dashboard</button>
                            </div>
                            <p class="text-xs text-center mt-6 text-stone-500">New user? <button onclick="currentView='signup'; render();" class="text-rose-600 dark:text-rose-400 font-extrabold hover:underline">Create Account</button></p>
                        </div>
                    `;
                } else {
                    app.innerHTML = `
                        <div class="w-full max-w-md bg-white dark:bg-[#150f20]/90 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-stone-200 dark:border-purple-950/60 relative">
                            <div class="absolute top-6 right-6 flex items-center space-x-2">
                                <button onclick="toggleTheme()" class="p-2 rounded-xl bg-stone-100 dark:bg-stone-800/80 text-stone-600 dark:text-stone-300 hover:bg-stone-200 dark:hover:bg-stone-700 transition text-xs font-bold flex items-center gap-1.5">
                                    ${currentTheme === 'dark' ? '☀️ Light' : '🌙 Dark'}
                                </button>
                            </div>

                            <div class="text-center mb-6 pt-2">
                                <div class="inline-flex p-3.5 bg-purple-50 dark:bg-purple-500/10 text-purple-600 dark:text-purple-400 rounded-2xl text-2xl mb-3 shadow-inner">🛡️</div>
                                <h2 class="text-2xl font-extrabold text-stone-900 dark:text-white tracking-tight">Create Profile</h2>
                                <p class="text-xs text-stone-400 mt-1">Initialize User Document Collection</p>
                            </div>
                            <div id="errorMsg" class="hidden bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-900/50 p-3 rounded-xl mb-4 text-xs text-center font-semibold"></div>
                            
                            <div class="space-y-3.5">
                                <div>
                                    <label class="text-[11px] font-bold uppercase tracking-wider text-stone-400">Full Name</label>
                                    <input id="signupName" type="text" placeholder="John Doe" onkeydown="if(event.key==='Enter') document.getElementById('signupEmail').focus()" class="w-full mt-1 p-3 border border-stone-200 dark:border-purple-950 rounded-xl text-sm bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-white outline-none focus:ring-2 focus:ring-purple-600 transition">
                                </div>
                                <div>
                                    <label class="text-[11px] font-bold uppercase tracking-wider text-stone-400">Email Address</label>
                                    <input id="signupEmail" type="email" placeholder="name@example.com" onkeydown="if(event.key==='Enter') document.getElementById('signupPassword').focus()" class="w-full mt-1 p-3 border border-stone-200 dark:border-purple-950 rounded-xl text-sm bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-white outline-none focus:ring-2 focus:ring-purple-600 transition">
                                </div>
                                <div>
                                    <label class="text-[11px] font-bold uppercase tracking-wider text-stone-400">Secure Password</label>
                                    <input id="signupPassword" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') handleSignup()" class="w-full mt-1 p-3 border border-stone-200 dark:border-purple-950 rounded-xl text-sm bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-white outline-none focus:ring-2 focus:ring-purple-600 transition">
                                </div>
                                <button onclick="handleSignup()" class="w-full bg-purple-600 hover:bg-purple-500 text-white p-3.5 rounded-xl font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-purple-600/30 transition mt-2">Complete Registration</button>
                            </div>
                            <p class="text-xs text-center mt-6 text-stone-500">Already registered? <button onclick="currentView='login'; render();" class="text-rose-600 dark:text-rose-400 font-extrabold hover:underline">Sign In</button></p>
                        </div>
                    `;
                }
            } else {
                app.className = "flex-1 w-full flex flex-col bg-stone-50/50 dark:bg-[#0c0814]";
                app.innerHTML = `
                    <header class="sticky top-0 z-40 bg-white/80 dark:bg-[#150f20]/80 backdrop-blur-md border-b border-stone-200/80 dark:border-purple-950/60 px-8 py-3.5 flex justify-between items-center shadow-xs">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-600 to-purple-600 text-white flex items-center justify-center font-extrabold text-base shadow-md shadow-rose-600/20">🔮</div>
                            <div>
                                <h1 class="text-sm font-extrabold text-stone-900 dark:text-white tracking-tight">WealthPulse • Neo-Cyber Engine</h1>
                                <p class="text-[11px] text-stone-400 font-medium flex items-center gap-1.5 mt-0.5">
                                    <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
                                    MongoDB DB-Storage Cluster • User: <span class="font-bold text-stone-700 dark:text-stone-300">${currentUser}</span>
                                </p>
                            </div>
                        </div>
                        
                        <div class="flex items-center space-x-3">
                            <button onclick="downloadCSV()" class="px-3 py-1.5 rounded-xl bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-900/40 hover:bg-amber-100 dark:hover:bg-amber-900/30 transition text-xs font-bold flex items-center gap-1.5 shadow-2xs">
                                📥 Export CSV Ledger
                            </button>
                            <button onclick="toggleTheme()" class="px-3 py-1.5 rounded-xl bg-stone-100 dark:bg-stone-800 text-stone-700 dark:text-stone-200 hover:bg-stone-200 dark:hover:bg-stone-700 transition text-xs font-bold flex items-center gap-1.5">
                                ${currentTheme === 'dark' ? '☀️ Light' : '🌙 Dark'}
                            </button>
                            <button onclick="logout()" class="bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-100 dark:border-rose-900/40 px-3.5 py-1.5 rounded-xl text-xs font-bold hover:bg-rose-100 dark:hover:bg-rose-900/30 transition shadow-xs">Terminate Session</button>
                        </div>
                    </header>

                    <!-- STICKY UNIFIED HEADER BAR: Budget + Metrics Cards Combined -->
                    <div class="sticky top-[61px] z-30 bg-stone-50/90 dark:bg-[#0c0814]/90 backdrop-blur-md px-6 pt-4 pb-2 max-w-[1600px] mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-4">
                        <!-- Budget Control Card (Span 6) -->
                        <div class="lg:col-span-6 bg-white dark:bg-[#150f20]/90 backdrop-blur-xl p-5 rounded-3xl border border-stone-200/80 dark:border-purple-950/60 shadow-xl space-y-2.5">
                            <div class="flex justify-between items-center">
                                <h3 class="text-xs font-extrabold text-stone-400 uppercase tracking-wider flex items-center gap-1.5"><span>🎯</span> Monthly Spending Target</h3>
                                <button onclick="openBudgetModal()" class="text-xs text-rose-600 dark:text-rose-400 font-extrabold hover:underline">✏️ Recalibrate</button>
                            </div>
                            <div class="flex justify-between items-baseline">
                                <span id="budgetText" class="text-lg font-extrabold text-stone-900 dark:text-white">₹0.00</span>
                                <span id="budgetPercent" class="text-xs font-extrabold text-stone-400">0% Used</span>
                            </div>
                            <div class="w-full bg-stone-100 dark:bg-stone-950 rounded-full h-3 overflow-hidden p-0.5 border border-stone-200/50 dark:border-purple-950">
                                <div id="budgetProgressBar" class="bg-rose-500 h-2 rounded-full transition-all duration-700 shadow-xs" style="width: 0%"></div>
                            </div>
                            <p id="budgetStatusMsg" class="text-[11px] font-bold text-stone-500 dark:text-stone-400"></p>
                        </div>

                        <!-- Metrics Boxes (Span 6) -->
                        <div class="lg:col-span-6 grid grid-cols-3 gap-3">
                            <div class="bg-white dark:bg-[#150f20]/90 backdrop-blur-xl p-4 rounded-3xl border border-stone-200/80 dark:border-purple-950/60 shadow-xl flex flex-col justify-center">
                                <p class="text-[10px] font-extrabold text-stone-400 uppercase tracking-wider">Month Spend</p>
                                <p id="totalSpend" class="text-lg font-extrabold text-rose-600 dark:text-rose-400 mt-1">₹0.00</p>
                            </div>
                            <div class="bg-white dark:bg-[#150f20]/90 backdrop-blur-xl p-4 rounded-3xl border border-stone-200/80 dark:border-purple-950/60 shadow-xl flex flex-col justify-center">
                                <p class="text-[10px] font-extrabold text-stone-400 uppercase tracking-wider">Pending Splits</p>
                                <p id="pendingSplitsTotal" class="text-lg font-extrabold text-amber-500 mt-1">₹0.00</p>
                            </div>
                            <div class="bg-white dark:bg-[#150f20]/90 backdrop-blur-xl p-4 rounded-3xl border border-stone-200/80 dark:border-purple-950/60 shadow-xl flex flex-col justify-center">
                                <p class="text-[10px] font-extrabold text-stone-400 uppercase tracking-wider">Total Entries</p>
                                <p id="totalCount" class="text-lg font-extrabold text-purple-600 dark:text-purple-400 mt-1">0</p>
                            </div>
                        </div>
                    </div>

                    <!-- MAIN CONTENT SPLIT WORKSPACE -->
                    <main class="flex-1 px-6 pb-6 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-[1600px] mx-auto w-full items-start">
                        
                        <!-- LEFT COLUMN: Sticky Transaction Entry Form (Span 4) -->
                        <div class="lg:col-span-4 sticky top-[220px] space-y-4">

        async function toggleRadarSearch() {
            isRadarActive = !isRadarActive;
            const statusText = document.getElementById('radarStatusText');
            const btn = document.getElementById('radarBtn');
            const radiusKm = document.getElementById('radiusInput').value || 5;

            if (!isRadarActive) {
                statusText.innerText = "Off";
                statusText.className = "font-bold text-stone-400";
                btn.classList.remove('bg-purple-600', 'text-white');
                displayExpenses(allExpenses);
                return;
            }

            statusText.innerText = "Active (" + radiusKm + "km)";
            statusText.className = "font-bold text-emerald-400";
            btn.classList.add('bg-purple-600', 'text-white');

            try {
                const res = await fetch(`${API}/api/analytics/nearby/${currentUser}?longitude=${cachedCoords.longitude}&latitude=${cachedCoords.latitude}&maxDistanceKm=${radiusKm}`);
                const nearbyData = await res.json();
                displayExpenses(nearbyData, true);
            } catch (err) {
                alert("Failed to execute spatial query.");
                isRadarActive = false;
                statusText.innerText = "Off";
            }
        }

        function downloadCSV() {
            window.location.href = `${API}/api/export/csv/${currentUser}`;
        }

        function handleLoginInputKey(event, field) {
            if (event.key === 'Enter') {
                if (field === 'email') document.getElementById('loginPassword').focus();
                else if (field === 'password') handleLogin();
            }
        }

        function openBudgetModal() {
            const currentBudget = (currentUserObj && currentUserObj.monthlyBudget) ? currentUserObj.monthlyBudget : 10000;
            document.getElementById('newBudgetInput').value = currentBudget;
            document.getElementById('budgetModal').classList.remove('hidden');
        }

        function closeBudgetModal() {
            document.getElementById('budgetModal').classList.add('hidden');
        }

        async function submitNewBudget() {
            const newBudgetValue = document.getElementById('newBudgetInput').value;
            const parsedBudget = parseFloat(newBudgetValue);
            if (isNaN(parsedBudget) || parsedBudget <= 0) return alert("Please enter a valid amount.");

            const response = await fetch(`${API}/api/user/budget`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentUser, budget: parsedBudget })
            });
            const data = await response.json();
            if (response.ok) {
                currentUserObj = data.user;
                localStorage.setItem('currentUserObj', JSON.stringify(currentUserObj));
                closeBudgetModal();
                loadDashboardData();
            } else {
                alert("Failed to update budget.");
            }
        }

        function openEditModal(id, title, amount, category, date) {
            document.getElementById('editId').value = id;
            document.getElementById('editTitle').value = title;
            document.getElementById('editAmount').value = amount;
            document.getElementById('editCategory').value = category;
            document.getElementById('editDate').value = date;
            editCapturedImageBlob = null;
            document.getElementById('editReceiptFile').value = "";
            document.getElementById('editSnapshotStatus').classList.add('hidden');
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function submitEditTransaction() {
            const id = document.getElementById('editId').value;
            const title = document.getElementById('editTitle').value;
            const amount = document.getElementById('editAmount').value;
            const category = document.getElementById('editCategory').value;
            const date = document.getElementById('editDate').value;

            if (!title || !amount || !category || !date) return alert("All fields are required.");

            const formData = new FormData();
            formData.append('title', title);
            formData.append('amount', amount);
            formData.append('category', category);
            formData.append('date', date);

            if (editCapturedImageBlob) {
                formData.append('receipt', editCapturedImageBlob);
            } else {
                const fileInput = document.getElementById('editReceiptFile');
                if (fileInput.files[0]) formData.append('receipt', fileInput.files[0]);
            }

            const response = await fetch(`${API}/api/expenses/${id}`, {
                method: 'PATCH',
                body: formData
            });

            if (response.ok) {
                editCapturedImageBlob = null;
                closeEditModal();
                loadDashboardData();
            } else {
                alert("Failed to update transaction document.");
            }
        }

        function updateBudgetUI(currentMonthSpend) {
            const budget = (currentUserObj && currentUserObj.monthlyBudget) ? currentUserObj.monthlyBudget : 10000;
            const percentage = (currentMonthSpend / budget) * 100;

            document.getElementById('budgetText').innerText = `₹${budget.toFixed(2)}`;
            document.getElementById('budgetPercent').innerText = `${percentage.toFixed(1)}% Used`;

            const bar = document.getElementById('budgetProgressBar');
            const msg = document.getElementById('budgetStatusMsg');

            bar.style.width = `${Math.min(percentage, 100)}%`;
            bar.className = "h-2 rounded-full transition-all duration-700 shadow-xs";

            if (percentage < 75) {
                bar.classList.add('bg-emerald-500');
                msg.innerText = "🟢 Safe Zone: Well within current month budget.";
                msg.className = "text-[11px] font-bold text-emerald-600 dark:text-emerald-400";
            } else if (percentage < 95) {
                bar.classList.add('bg-amber-500');
                msg.innerText = "🟡 Caution Zone: Approaching monthly budget threshold.";
                msg.className = "text-[11px] font-bold text-amber-600 dark:text-amber-400";
            } else if (percentage <= 100) {
                bar.classList.add('bg-orange-500');
                msg.innerText = "🟠 Danger Zone: Right on the edge of your monthly limit!";
                msg.className = "text-[11px] font-bold text-orange-600 dark:text-orange-400";
            } else {
                bar.classList.add('bg-rose-600', 'animate-pulse');
                msg.innerText = "🔴 Breach Zone: Monthly budget limit exceeded!";
                msg.className = "text-[11px] font-extrabold text-rose-600 dark:text-rose-400 animate-pulse";
            }
        }

        function toggleRecurringField() {
            const isChecked = document.getElementById('isRecurring').checked;
            document.getElementById('recurringBox').classList.toggle('hidden', !isChecked);
        }

        async function openCamera(context = 'add') {
            activeCameraContext = context;
            document.getElementById('cameraModal').classList.remove('hidden');
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                document.getElementById('webcamVideo').srcObject = mediaStream;
            } catch (err) {
                alert("Unable to access webcam.");
                closeCamera();
            }
        }

        function closeCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            document.getElementById('cameraModal').classList.add('hidden');
        }

        function capturePhoto() {
            const video = document.getElementById('webcamVideo');
            const canvas = document.getElementById('snapshotCanvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob((blob) => {
                const snapshotFile = new File([blob], `db-snap-${Date.now()}.jpg`, { type: 'image/jpeg' });
                if (activeCameraContext === 'edit') {
                    editCapturedImageBlob = snapshotFile;
                    document.getElementById('editSnapshotStatus').classList.remove('hidden');
                    document.getElementById('editReceiptFile').value = "";
                } else {
                    capturedImageBlob = snapshotFile;
                    document.getElementById('snapshotStatus').classList.remove('hidden');
                    document.getElementById('receiptFile').value = "";
                }
                closeCamera();
            }, 'image/jpeg');
        }

        function openModal(id) {
            document.getElementById('modalImg').src = `${API}/api/expenses/receipt/${id}`;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        async function handleSignup() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            if (!name || !email || !password) return showError("All fields are required");

            const response = await fetch(`${API}/api/signup`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            const data = await response.json();
            if (response.ok) {
                alert("Account created successfully!");
                currentView = 'login';
                render();
            } else {
                showError(data.error);
            }
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) return showError("All fields are required");

            const response = await fetch(`${API}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json();
            if (response.ok) {
                currentUser = data.user.email;
                currentUserObj = data.user;
                localStorage.setItem('userEmail', currentUser);
                localStorage.setItem('currentUserObj', JSON.stringify(currentUserObj));
                render();
            } else {
                showError(data.error);
            }
        }

        function showError(msg) {
            const errDiv = document.getElementById('errorMsg');
            if (errDiv) { errDiv.innerText = msg; errDiv.classList.remove('hidden'); }
        }

        function showFormError(msg) {
            const errDiv = document.getElementById('formErrorMsg');
            if (errDiv) {
                errDiv.innerText = msg;
                errDiv.classList.remove('hidden');
                setTimeout(() => errDiv.classList.add('hidden'), 5000);
            }
        }

        async function loadDashboardData() {
            const res = await fetch(`${API}/api/expenses/${currentUser}`);
            allExpenses = await res.json();
            displayExpenses(allExpenses);

            const currentMonthPrefix = new Date().toISOString().slice(0, 7);
            const currentMonthExpenses = allExpenses.filter(e => e.date && e.date.startsWith(currentMonthPrefix));

            const currentMonthTotal = currentMonthExpenses.reduce((sum, e) => sum + e.amount, 0);
            document.getElementById('totalSpend').innerText = `₹${currentMonthTotal.toFixed(2)}`;
            document.getElementById('totalCount').innerText = allExpenses.length;

            const pendingSplits = allExpenses.filter(e => e.isSplit && !e.settled).reduce((sum, e) => sum + e.amount, 0);
            document.getElementById('pendingSplitsTotal').innerText = `₹${pendingSplits.toFixed(2)}`;

            updateBudgetUI(currentMonthTotal);

            const trendRes = await fetch(`${API}/api/analytics/trends/${currentUser}`);
            const trendData = await trendRes.json();
            const trendBox = document.getElementById('trendComparisonBox');
            const diff = trendData.currentMonth - trendData.previousMonth;
            const percentDiff = trendData.previousMonth > 0 ? ((diff / trendData.previousMonth) * 100).toFixed(1) : 0;

            trendBox.innerHTML = `
                <div>
                    <p class="font-bold text-stone-800 dark:text-white">Month-over-Month Velocity</p>
                    <p class="text-[11px] text-stone-500 dark:text-stone-400 mt-0.5">Previous: ₹${trendData.previousMonth.toFixed(2)} vs Current: ₹${trendData.currentMonth.toFixed(2)}</p>
                </div>
                <span class="px-2.5 py-1 rounded-xl text-xs font-extrabold ${diff <= 0 ? 'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-700 dark:text-emerald-400' : 'bg-rose-100 dark:bg-rose-500/20 text-rose-700 dark:text-rose-400'}">
                    ${diff <= 0 ? '↓ ' + Math.abs(percentDiff) + '% Less' : '↑ ' + percentDiff + '% More'}
                </span>
            `;

            const aggRes = await fetch(`${API}/api/analytics/category/${currentUser}`);
            const aggData = await aggRes.json();
            const aggDiv = document.getElementById('aggregationBreakdown');

            if (aggData.length === 0) {
                aggDiv.innerHTML = `<span class="text-stone-400 text-xs font-medium">No documents found for current calendar month.</span>`;
            } else {
                aggDiv.innerHTML = aggData.map(item => `
                    <div class="bg-stone-50 dark:bg-[#0c0814] p-3.5 rounded-2xl border border-stone-200 dark:border-purple-950/60 shadow-2xs">
                        <p class="font-extrabold text-stone-900 dark:text-white text-xs">${item._id}</p>
                        <p class="text-rose-600 dark:text-rose-400 font-extrabold text-sm mt-1">₹${item.totalSpent.toFixed(2)}</p>
                        <p class="text-[10px] text-stone-500 dark:text-stone-400 mt-1 font-semibold">${item.count} transaction document(s)</p>
                    </div>
                `).join('');
            }
        }

        function displayExpenses(expenses, isSpatialFiltered = false) {
            const list = document.getElementById('expenseList');
            if (expenses.length === 0) {
                list.innerHTML = `<p class="text-xs text-stone-400 dark:text-stone-500 text-center py-8 font-medium">${isSpatialFiltered ? 'No transaction records found within the specified radius.' : 'No matching transaction records found in database.'}</p>`;
                return;
            }
            list.innerHTML = expenses.map(e => {
                const coords = (e.location && e.location.coordinates) ? e.location.coordinates : [0, 0];
                const hasGeo = coords[0] !== 0 || coords[1] !== 0;

                return `
                    <div class="flex justify-between items-center p-4 bg-stone-50/70 dark:bg-[#0c0814]/60 hover:bg-stone-100/80 dark:hover:bg-[#0c0814] rounded-2xl border border-stone-200/60 dark:border-purple-950/60 transition shadow-2xs">
                        <div>
                            <div class="flex items-center space-x-2">
                                <h4 class="font-extrabold text-stone-900 dark:text-white text-sm">${e.title}</h4>
                                <span class="text-rose-600 dark:text-rose-400 font-extrabold text-sm">(₹${e.amount.toFixed(2)})</span>
                            </div>
                            <p class="text-xs text-stone-500 dark:text-stone-400 mt-1 font-medium">
                                <span class="font-bold text-stone-700 dark:text-stone-300">${e.category}</span> • ${e.date}
                                ${e.isSplit ? `• Split: <span class="font-extrabold ${e.settled ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-500'}">${e.settled ? 'Settled' : 'Pending'}</span>` : ''}
                                ${hasGeo ? `• <span class="text-emerald-500 font-bold">📍 (${coords[1].toFixed(2)},${coords[0].toFixed(2)})</span>` : ''}
                            </p>
                            <div class="flex items-center gap-2 mt-2">
                                ${e.tags && e.tags.length > 0 ? e.tags.map(t => `<span class="bg-purple-50 dark:bg-purple-500/10 text-purple-700 dark:text-purple-300 text-[10px] px-2.5 py-0.5 rounded-full font-extrabold border border-purple-100 dark:border-purple-900/40">#${t.trim()}</span>`).join('') : ''}
                                ${e.hasReceipt ? `<button onclick="openModal('${e._id}')" class="text-[10px] bg-purple-50 dark:bg-purple-500/10 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-900/40 px-2.5 py-0.5 rounded-lg font-extrabold hover:bg-purple-100 transition">View DB Document 📄</button>` : `<span class="text-[10px] text-stone-400 font-medium italic">Document not uploaded</span>`}
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            ${e.isSplit ? `<button onclick="toggleSettle('${e._id}')" class="text-xs bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-200 dark:border-amber-900/40 px-3 py-1.5 rounded-xl font-extrabold hover:bg-amber-100 transition shadow-2xs">Toggle Settle</button>` : ''}
                            <button onclick="openEditModal('${e._id}', '${e.title}', ${e.amount}, '${e.category}', '${e.date}')" class="bg-purple-50 dark:bg-purple-500/10 text-purple-700 dark:text-purple-300 border border-purple-100 dark:border-purple-900/40 px-3 py-1.5 rounded-xl text-xs font-extrabold hover:bg-purple-100 transition shadow-2xs">Edit</button>
                            <button onclick="deleteExpense('${e._id}')" class="bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-100 dark:border-rose-900/40 px-3 py-1.5 rounded-xl text-xs font-extrabold hover:bg-rose-100 transition shadow-2xs">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterExpenses() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allExpenses.filter(e =>
                e.title.toLowerCase().includes(query) ||
                e.category.toLowerCase().includes(query) ||
                (e.tags && e.tags.some(t => t.toLowerCase().includes(query)))
            );
            displayExpenses(filtered);
        }

        async function addExpense(event) {
            event.preventDefault();

            const formData = new FormData();
            formData.append('userId', currentUser);
            formData.append('title', document.getElementById('title').value);
            formData.append('amount', document.getElementById('amount').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('date', document.getElementById('date').value);
            formData.append('tags', document.getElementById('tags').value);
            formData.append('isSplit', document.getElementById('isSplit').checked);
            formData.append('isRecurring', document.getElementById('isRecurring').checked);
            formData.append('frequency', document.getElementById('frequency').value);

            formData.append('longitude', cachedCoords.longitude);
            formData.append('latitude', cachedCoords.latitude);

            if (capturedImageBlob) {
                formData.append('receipt', capturedImageBlob);
            } else {
                const fileInput = document.getElementById('receiptFile');
                if (fileInput.files[0]) formData.append('receipt', fileInput.files[0]);
            }

            try {
                const res = await fetch(`${API}/api/expenses`, { method: 'POST', body: formData });
                const data = await res.json();
                if (!data._id && data.error) {
                    showFormError(data.error);
                } else {
                    capturedImageBlob = null;
                    isRadarActive = false;
                    render();
                }
            } catch (err) {
                showFormError("Failed to insert document.");
            }
        }

        async function toggleSettle(id) {
            await fetch(`${API}/api/expenses/settle/${id}`, { method: 'PATCH' });
            loadDashboardData();
        }

        async function deleteExpense(id) {
            await fetch(`${API}/api/expenses/${id}`, { method: 'DELETE' });
            loadDashboardData();
        }

        function logout() {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('currentUserObj');
            currentUser = null;
            currentUserObj = null;
            currentView = 'login';
            render();
        }

        render();
    </script>
</body>

</html>
